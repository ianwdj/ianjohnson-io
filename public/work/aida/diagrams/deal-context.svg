<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>A fictional deal showing account, contact, linked conversations and evidence-backed derived state.</title><defs><pattern id="paper-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="0.85" fill="#D6D3C9"/></pattern><marker id="arr" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#267454" stroke-width="1.4"/></marker></defs><rect width="1440" height="900" fill="#FAF9F5"/><rect width="1440" height="900" fill="url(#paper-dots)"/><g font-family="Inter,Arial,sans-serif"><text x="54" y="55" font-size="13" font-weight="600" fill="#727B74">01 / A DEAL’S LINKED HISTORY</text><rect x="1150" y="34" width="156.6" height="27" rx="9" fill="#EFF6F1" stroke="none"/><text x="1162" y="53" font-size="13" font-weight="600" fill="#267454">Fictional example</text><path d="M334 237H397V174H454" fill="none" stroke="#CDD7CF" stroke-width="1.8" marker-end="url(#arr)" /><rect x="347" y="201" width="96" height="25" rx="9" fill="white" stroke="none"/><text x="354" y="218" font-size="14" font-weight="400" fill="#727B74">belongs to</text><path d="M640 331V228" fill="none" stroke="#CDD7CF" stroke-width="1.8" marker-end="url(#arr)" /><rect x="653" y="270" width="96" height="25" rx="9" fill="white" stroke="none"/><text x="660" y="287" font-size="14" font-weight="400" fill="#727B74">belongs to</text><path d="M254 500V304" fill="none" stroke="#267454" stroke-width="1.8" marker-end="url(#arr)" /><rect x="264" y="391" width="79.6" height="25" rx="9" fill="white" stroke="none"/><text x="271" y="408" font-size="14" font-weight="400" fill="#727B74">involves</text><path d="M396 554H466V408H494" fill="none" stroke="#267454" stroke-width="1.8" marker-end="url(#arr)" /><rect x="404" y="472" width="96" height="25" rx="9" fill="white" stroke="none"/><text x="411" y="489" font-size="14" font-weight="400" fill="#727B74">relates to</text><path d="M653 612V433" fill="none" stroke="#267454" stroke-width="1.8" marker-end="url(#arr)" /><rect x="667" y="534" width="96" height="25" rx="9" fill="white" stroke="none"/><text x="674" y="551" font-size="14" font-weight="400" fill="#727B74">relates to</text><rect x="454" y="123" width="339" height="100" rx="9" fill="white" stroke="#CDD7CF"/><text x="474" y="148" font-size="12" font-weight="600" fill="#727B74">ACCOUNT</text><text x="474" y="177" font-size="21" font-weight="600" fill="#27332C">Northstar</text><text x="474" y="204" font-size="15" font-weight="400" fill="#727B74">Canonical CRM account</text><rect x="75" y="204" width="259" height="100" rx="9" fill="white" stroke="#CDD7CF"/><text x="95" y="229" font-size="12" font-weight="600" fill="#727B74">CONTACT</text><text x="95" y="258" font-size="21" font-weight="600" fill="#27332C">Maya Chen</text><text x="95" y="285" font-size="15" font-weight="400" fill="#727B74">Contact at Northstar</text><rect x="494" y="333" width="299" height="100" rx="9" fill="white" stroke="#CDD7CF"/><text x="514" y="358" font-size="12" font-weight="600" fill="#727B74">OPPORTUNITY</text><text x="514" y="387" font-size="21" font-weight="600" fill="#27332C">Northstar pilot</text><text x="514" y="414" font-size="15" font-weight="400" fill="#727B74">Owner: Alex · stage: evaluation</text><rect x="75" y="500" width="321" height="178" rx="9" fill="#FAFCFA" stroke="#CDD7CF"/><rect x="92" y="516" width="156.6" height="27" rx="9" fill="#EFF6F1" stroke="none"/><text x="104" y="535" font-size="13" font-weight="600" fill="#267454">01 · Tuesday call</text><text x="95" y="568" font-size="19" font-weight="600" fill="#27332C">“Alex, send the security</text><text x="95" y="595" font-size="19" font-weight="600" fill="#27332C">overview by Friday.”</text><text x="95" y="646" font-size="14" font-weight="400" fill="#727B74">Speaker and source retained</text><rect x="471" y="612" width="357" height="177" rx="9" fill="#FAFCFA" stroke="#CDD7CF"/><image x="490" y="629" width="24" height="24" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="525" y="649" font-size="14" font-weight="600" fill="#267454">02 · Wednesday email</text><text x="492" y="695" font-size="19" font-weight="600" fill="#27332C">“We need security approval</text><text x="492" y="722" font-size="19" font-weight="600" fill="#27332C">before starting the pilot.”</text><text x="492" y="766" font-size="14" font-weight="400" fill="#727B74">Linked to the same opportunity</text><path d="M904 115V793" fill="none" stroke="#CDD7CF" stroke-width="1.8" stroke-dasharray="4 7"/><text x="986" y="139" font-size="12" font-weight="600" fill="#727B74">DERIVED FROM LINKED ACTIVITY</text><path d="M793 381H945V237H986" fill="none" stroke="#267454" stroke-width="1.8" marker-end="url(#arr)" stroke-dasharray="5 5"/><path d="M945 381H986" fill="none" stroke="#267454" stroke-width="1.8" marker-end="url(#arr)" stroke-dasharray="5 5"/><path d="M945 381V569H986" fill="none" stroke="#267454" stroke-width="1.8" marker-end="url(#arr)" stroke-dasharray="5 5"/><rect x="986" y="180" width="397" height="126" rx="9" fill="#EFF6F1" stroke="#CDD7CF"/><text x="1008" y="208" font-size="12" font-weight="600" fill="#267454">COMMITMENT</text><text x="1008" y="241" font-size="20" font-weight="600" fill="#27332C">Send the security overview</text><text x="1008" y="274" font-size="16" font-weight="400" fill="#27332C">Alex · due Friday</text><rect x="1284" y="266" width="39.6" height="27" rx="9" fill="#EFF6F1" stroke="none"/><text x="1296" y="285" font-size="13" font-weight="600" fill="#267454">01</text><rect x="986" y="337" width="397" height="126" rx="9" fill="white" stroke="#CDD7CF"/><text x="1008" y="367" font-size="12" font-weight="600" fill="#267454">RISK / OPEN REQUIREMENT</text><text x="1008" y="400" font-size="20" font-weight="600" fill="#27332C">Security approval is pending</text><text x="1008" y="434" font-size="16" font-weight="400" fill="#27332C">Evidence: buyer’s email</text><rect x="1284" y="423" width="39.6" height="27" rx="9" fill="#EFF6F1" stroke="none"/><text x="1296" y="442" font-size="13" font-weight="600" fill="#267454">02</text><rect x="986" y="502" width="397" height="135" rx="9" fill="white" stroke="#CDD7CF"/><text x="1008" y="533" font-size="12" font-weight="600" fill="#267454">UPDATED DEAL SUMMARY</text><text x="1008" y="569" font-size="18" font-weight="400" fill="#27332C">Pilot depends on security review.</text><text x="1008" y="598" font-size="18" font-weight="400" fill="#27332C">Overview due Friday; Alex owns it.</text><rect x="1260" y="604" width="78.6" height="27" rx="9" fill="#EFF6F1" stroke="none"/><text x="1272" y="623" font-size="13" font-weight="600" fill="#267454">01 + 02</text><text x="986" y="713" font-size="16" font-weight="600" fill="#27332C">Derived state keeps its source references.</text><text x="986" y="742" font-size="16" font-weight="400" fill="#727B74">New activity can refresh the deal context.</text><text x="54" y="849" font-size="14" font-weight="400" fill="#727B74">Solid links: entity associations. Dashed links: extraction into useful deal state. Sources 01 and 02 are invented for this illustration.</text></g></svg>